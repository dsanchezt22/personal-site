<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>OG</title>
  <link rel="stylesheet" href="../../styles.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
    .card {
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      padding: 72px 80px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card h1 { font-size: 84px; line-height: 0.96; }
    .card .dek { font-size: 28px; line-height: 1.35; max-width: none; margin-top: 28px; }
    .card .foot { font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
  </style>
</head>
<body>
  <div class="card">
    <div>
      <p class="kicker">Stanford EE · Class of 2029</p>
      <h1><span>Diego</span><span>Sanchez</span><span>Tirado</span></h1>
      <p class="dek">Computer architecture and software.<br>Summer 2027.</p>
    </div>
    <p class="foot">Stanford, CA</p>
  </div>
</body>
</html>
